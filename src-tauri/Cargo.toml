[package]
name = "gamestudio"
version = "0.2.1"
description = "Gamestudio, a workbench for game developers and the coding agents that build their games"
authors = ["Nathan Plouvier"]
license = "MIT"
# Releases, and so self-updates, come from this repo: a fork changes it to update from its own.
repository = "https://github.com/nihiloproxima/gamestudio"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (https://github.com/rust-lang/cargo/issues/8519).
name = "gamestudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
portable-pty = "0.9.0"
humantime = "2.4.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
